<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minha Rotina</title>
<style>
:root{--bg:#f4f6fb;--panel:#fff;--ink:#182230;--muted:#6b7280;--line:#e7ebf1;--blue:#315efb;--nav:#17243a;--green:#16865b;--red:#c44545;--amber:#a66a12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}
.app{display:flex;min-height:100vh}.side{width:245px;background:var(--nav);color:#fff;padding:24px 16px;display:flex;flex-direction:column;gap:22px}.brand{font-size:21px;font-weight:750;padding:0 10px}.brand small{display:block;color:#aab6c8;font-size:12px;font-weight:400;margin-top:4px}.nav{display:grid;gap:6px}.nav button{background:transparent;border:0;color:#cbd5e1;text-align:left;padding:12px;border-radius:9px;font-size:14px;cursor:pointer}.nav button.active,.nav button:hover{background:#293a56;color:#fff}.side-note{margin-top:auto;color:#aab6c8;font-size:12px;line-height:1.5;padding:10px}
main{flex:1;min-width:0;padding:28px clamp(16px,3vw,42px);max-width:1500px;margin:0 auto;width:100%}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}.eyebrow{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}.top h1{font-size:27px;margin:3px 0 0}.actions{display:flex;gap:9px;flex-wrap:wrap}
button,.btn{cursor:pointer}.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:11px 15px;font-weight:650}.secondary{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 13px;color:var(--ink)}.danger{color:var(--red);border:1px solid #f0d4d4;background:#fff;border-radius:8px;padding:8px 10px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 2px 8px #15233b08}.stat-label{font-size:13px;color:var(--muted)}.stat{font-size:30px;font-weight:750;margin-top:8px}.stat-sub{font-size:12px;color:var(--muted);margin-top:3px}.section{margin-top:22px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.section h2{font-size:17px;margin:0}.muted{color:var(--muted)}.list{display:grid;gap:9px}.task{display:flex;align-items:center;gap:12px;padding:13px;border:1px solid var(--line);border-radius:11px;background:#fff}.task-main{min-width:0;flex:1}.task-title{font-weight:650;overflow-wrap:anywhere}.task-meta{font-size:12px;color:var(--muted);margin-top:4px}.pill{display:inline-flex;align-items:center;border-radius:99px;padding:4px 8px;font-size:11px;font-weight:650;background:#eef2f7;color:#526071}.p-high{background:#ffeded;color:#b33b3b}.p-medium{background:#fff4dc;color:#96610e}.p-low{background:#e7f6ee;color:#18734d}.s-done{background:#e5f5ec;color:#18734d}.s-progress{background:#e9efff;color:#3155bd}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:13px}.toolbar input,.toolbar select{max-width:240px}.field, input,select,textarea{font:inherit}input,select,textarea{border:1px solid #dce2ea;border-radius:8px;padding:10px;background:#fff;color:var(--ink);width:100%}textarea{min-height:78px;resize:vertical}label{display:grid;gap:6px;font-size:13px;color:#465264}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.empty{padding:30px;text-align:center;color:var(--muted);background:#fff;border:1px dashed #d8dee8;border-radius:12px}.tablewrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:600px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted);font-weight:650;background:#fafbfc}.month{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{background:#fff;border:1px solid var(--line);border-radius:9px;min-height:90px;padding:8px;font-size:12px}.day strong{display:block;margin-bottom:5px}.day.today{border-color:var(--blue)}.daytask{display:block;background:#eaf0ff;color:#2849b5;border-radius:5px;padding:3px 4px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.modalback{position:fixed;inset:0;background:#10182880;display:none;align-items:center;justify-content:center;padding:16px;z-index:5}.modal{background:#fff;border-radius:15px;padding:22px;width:min(650px,100%);max-height:90vh;overflow:auto}.modal h2{margin:0 0 17px}.modalfoot{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.notice{padding:12px 14px;border-radius:10px;background:#fff6e6;color:#81550e;border:1px solid #f1dfb9;margin-bottom:14px;font-size:13px}.progress{height:9px;background:#edf0f5;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:var(--green)}.hidden{display:none!important}
@media(max-width:850px){.side{width:68px;padding:16px 8px}.brand{font-size:0;padding:0 8px}.brand:before{content:"MR";font-size:17px}.brand small,.nav .txt,.side-note{display:none}.nav button{text-align:center;font-size:0;padding:13px 4px}.nav button:before{content:attr(data-icon);font-size:18px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.app{display:block}.side{width:auto;height:auto;padding:8px;position:sticky;top:0;z-index:3}.brand{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:9px 11px;font-size:12px}.nav button:before{content:""}.nav .txt{display:inline}.side-note{display:none}main{padding:19px 13px}.top{align-items:flex-start;flex-direction:column}.top h1{font-size:23px}.grid{gap:9px}.card{padding:13px}.stat{font-size:25px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.month{gap:3px}.day{min-height:68px;padding:4px;font-size:10px}}
</style></head>
<body><div class="app">
<aside class="side"><div class="brand">Minha Rotina<small>Organize seu dia. Acompanhe sua evolução.</small></div>
<nav class="nav">
<button class="active" data-page="inicio" data-icon="⌂"><span class="txt">⌂ &nbsp; Visão geral</span></button>
<button data-page="tarefas" data-icon="✓"><span class="txt">✓ &nbsp; Minhas tarefas</span></button>
<button data-page="calendario" data-icon="▦"><span class="txt">▦ &nbsp; Calendário</span></button>
<button data-page="projetos" data-icon="▤"><span class="txt">▤ &nbsp; Projetos</span></button>
<button data-page="relatorios" data-icon="▥"><span class="txt">▥ &nbsp; Relatórios</span></button>
<button data-page="config" data-icon="⚙"><span class="txt">⚙ &nbsp; Configurações</span></button>
</nav><div class="side-note">Seus dados ficam salvos neste navegador. Faça backups em Configurações.</div></aside>
<main><div class="top"><div><div class="eyebrow">Seu espaço pessoal</div><h1 id="pageTitle">Visão geral</h1></div><div class="actions"><button class="secondary" onclick="exportData()">Exportar backup</button><button class="primary" onclick="openTask()">+ Nova tarefa</button></div></div>
<div id="content"></div></main></div>
<div class="modalback" id="taskModal"><div class="modal"><h2 id="modalTitle">Nova tarefa</h2><form id="taskForm"><input type="hidden" id="taskId"><div class="formgrid">
<label class="full">Nome da tarefa *<input id="fTitle" required maxlength="140" placeholder="Ex.: Estudar para a prova"></label>
<label>Categoria<input id="fCategory" list="categories" placeholder="Pessoal, estudos, trabalho..."><datalist id="categories"><option>Pessoal</option><option>Trabalho</option><option>Estudos</option><option>Saúde</option><option>Casa</option></datalist></label>
<label>Projeto<select id="fProject"><option value="">Sem projeto</option></select></label>
<label>Prioridade<select id="fPriority"><option>Baixa</option><option selected>Média</option><option>Alta</option></select></label>
<label>Status<select id="fStatus"><option>A fazer</option><option>Em andamento</option><option>Concluída</option><option>Arquivada</option></select></label>
<label>Data de início<input id="fStart" type="date"></label><label>Prazo<input id="fDue" type="date"></label>
<label>Repetição<select id="fRepeat"><option>Nenhuma</option><option>Diária</option><option>Semanal</option><option>Mensal</option></select></label>
<label class="full">Descrição / observações<textarea id="fNotes" placeholder="Detalhes, links ou informações importantes"></textarea></label>
</div><div class="modalfoot"><button type="button" class="secondary" onclick="closeTask()">Cancelar</button><button class="primary" type="submit">Salvar tarefa</button></div></form></div></div>
<div class="modalback" id="projectModal"><div class="modal"><h2>Novo projeto</h2><form id="projectForm"><div class="formgrid"><label class="full">Nome do projeto *<input id="pName" required></label><label class="full">Descrição<textarea id="pDesc"></textarea></label><label>Status<select id="pStatus"><option>Planejado</option><option>Em andamento</option><option>Concluído</option></select></label><label>Prazo<input id="pDue" type="date"></label></div><div class="modalfoot"><button type="button" class="secondary" onclick="document.getElementById('projectModal').style.display='none'">Cancelar</button><button class="primary">Salvar projeto</button></div></form></div></div>
<script>
const KEY='minhaRotina_v1';
let db=JSON.parse(localStorage.getItem(KEY)||'{"tasks":[],"projects":[]}'), page='inicio', monthCursor=new Date();
const $=id=>document.getElementById(id), today=()=>new Date().toISOString().slice(0,10);
function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateBR(d){if(!d)return 'Sem prazo';return new Date(d+'T12:00:00').toLocaleDateString('pt-BR')}
function dueState(t){return t.due&&t.due<today()&&!['Concluída','Arquivada'].includes(t.status)}
function priorityClass(p){return p==='Alta'?'p-high':p==='Média'?'p-medium':'p-low'}
function taskRow(t){return `<div class="task"><input type="checkbox" style="width:18px;height:18px" ${t.status==='Concluída'?'checked':''} onchange="toggleTask('${t.id}',this.checked)" aria-label="Concluir"><div class="task-main"><div class="task-title">${esc(t.title)}</div><div class="task-meta">${esc(t.category||'Sem categoria')} · ${dateBR(t.due)} ${t.project?' · '+esc(projectName(t.project)):''}</div></div><span class="pill ${priorityClass(t.priority)}">${esc(t.priority)}</span><span class="pill ${t.status==='Concluída'?'s-done':t.status==='Em andamento'?'s-progress':''}">${esc(t.status)}</span><button class="secondary" onclick="editTask('${t.id}')">Editar</button></div>`}
function projectName(id){return db.projects.find(p=>p.id===id)?.name||''}
function openTask(t=null){$('taskForm').reset();$('taskId').value=t?.id||'';$('modalTitle').textContent=t?'Editar tarefa':'Nova tarefa';$('fTitle').value=t?.title||'';$('fCategory').value=t?.category||'';$('fPriority').value=t?.priority||'Média';$('fStatus').value=t?.status||'A fazer';$('fStart').value=t?.start||today();$('fDue').value=t?.due||'';$('fRepeat').value=t?.repeat||'Nenhuma';$('fNotes').value=t?.notes||'';$('fProject').innerHTML='<option value="">Sem projeto</option>'+db.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');$('fProject').value=t?.project||'';$('taskModal').style.display='flex'}
function closeTask(){$('taskModal').style.display='none'}
function editTask(id){openTask(db.tasks.find(t=>t.id===id))}
$('taskForm').onsubmit=e=>{e.preventDefault();let id=$('taskId').value||'T'+Date.now(),old=db.tasks.find(t=>t.id===id);let t={id,title:$('fTitle').value.trim(),category:$('fCategory').value.trim(),project:$('fProject').value,priority:$('fPriority').value,status:$('fStatus').value,start:$('fStart').value,due:$('fDue').value,repeat:$('fRepeat').value,notes:$('fNotes').value,created:old?.created||new Date().toISOString(),completed:$('fStatus').value==='Concluída'?(old?.completed||today()):''};if(old)Object.assign(old,t);else db.tasks.unshift(t);closeTask();save()};
function toggleTask(id,checked){let t=db.tasks.find(x=>x.id===id);t.status=checked?'Concluída':'A fazer';t.completed=checked?today():'';save()}
function deleteTask(id){if(confirm('Excluir esta tarefa?')){db.tasks=db.tasks.filter(t=>t.id!==id);save()}}
function stats(){let a=db.tasks;return {total:a.length,open:a.filter(t=>!['Concluída','Arquivada'].includes(t.status)).length,progress:a.filter(t=>t.status==='Em andamento').length,done:a.filter(t=>t.status==='Concluída').length,late:a.filter(dueState).length,high:a.filter(t=>t.priority==='Alta'&&!['Concluída','Arquivada'].includes(t.status)).length}}
function card(label,note,num){return `<div class="card"><div class="stat-label">${label}</div><div class="stat">${num}</div><div class="stat-sub">${note}</div></div>`}
function dashboard(){let s=stats(),up=db.tasks.filter(t=>!['Concluída','Arquivada'].includes(t.status)).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')).slice(0,6),pct=s.total?Math.round(s.done/s.total*100):0;return `${s.late?`<div class="notice">Você tem <b>${s.late}</b> tarefa(s) com prazo vencido. Revise sua lista para reorganizar as prioridades.</div>`:''}<div class="grid">${card('Total de tarefas','Cadastradas',s.total)}${card('Em aberto','A fazer ou em andamento',s.open)}${card('Concluídas','Finalizadas',s.done)}${card('Atrasadas','Precisam de atenção',s.late)}</div><div class="section card"><div class="section-head"><h2>Progresso geral</h2><b>${pct}%</b></div><div class="progress"><span style="width:${pct}%"></span></div><p class="muted" style="font-size:12px">${s.done} de ${s.total} tarefas concluídas.</p></div><div class="section"><div class="section-head"><h2>Próximas tarefas</h2><button class="secondary" onclick="go('tarefas')">Ver todas</button></div><div class="list">${up.length?up.map(taskRow).join(''):'<div class="empty">Nenhuma tarefa pendente. Adicione sua primeira tarefa!</div>'}</div></div>`}
function taskPage(){return `<div class="toolbar"><input id="searchTask" placeholder="Buscar tarefa..." oninput="filterTasks()"><select id="filterStatus" onchange="filterTasks()"><option value="">Todos os status</option><option>A fazer</option><option>Em andamento</option><option>Concluída</option><option>Arquivada</option></select><select id="filterPriority" onchange="filterTasks()"><option value="">Todas as prioridades</option><option>Alta</option><option>Média</option><option>Baixa</option></select></div><div class="list" id="taskList">${db.tasks.length?db.tasks.map(taskRow).join(''):'<div class="empty">Sua lista está vazia. Clique em “Nova tarefa” para começar.</div>'}</div>`}
function filterTasks(){let q=$('searchTask').value.toLowerCase(),st=$('filterStatus').value,pr=$('filterPriority').value;let arr=db.tasks.filter(t=>(t.title+' '+t.category+' '+t.notes).toLowerCase().includes(q)&&(!st||t.status===st)&&(!pr||t.priority===pr));$('taskList').innerHTML=arr.length?arr.map(taskRow).join(''):'<div class="empty">Nenhuma tarefa encontrada.</div>'}
function calendarPage(){let y=monthCursor.getFullYear(),m=monthCursor.getMonth(),first=new Date(y,m,1),offset=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),cells=Array(offset).fill(null).concat(Array.from({length:days},(_,i)=>i+1));while(cells.length%7)cells.push(null);return `<div class="section-head"><button class="secondary" onclick="moveMonth(-1)">← Anterior</button><h2>${monthCursor.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</h2><button class="secondary" onclick="moveMonth(1)">Próximo →</button></div><div class="month">${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(x=>`<div class="muted" style="padding:5px;text-align:center">${x}</div>`).join('')}${cells.map(d=>{if(!d)return '<div></div>';let ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,items=db.tasks.filter(t=>t.due===ds);return `<div class="day ${ds===today()?'today':''}"><strong>${d}</strong>${items.map(t=>`<span class="daytask" title="${esc(t.title)}">${esc(t.title)}</span>`).join('')}</div>`}).join('')}</div><p class="muted" style="font-size:12px">As tarefas aparecem no dia definido como prazo.</p>`}
function moveMonth(n){monthCursor.setMonth(monthCursor.getMonth()+n);render()}
function projectsPage(){return `<div class="section-head"><h2>Seus projetos</h2><button class="primary" onclick="$('projectModal').style.display='flex'">+ Novo projeto</button></div>${db.projects.length?`<div class="grid">${db.projects.map(p=>`<div class="card"><div class="section-head"><b>${esc(p.name)}</b><span class="pill">${esc(p.status)}</span></div><p class="muted">${esc(p.desc||'Sem descrição')}</p><div class="stat-sub">${db.tasks.filter(t=>t.project===p.id&&t.status==='Concluída').length} / ${db.tasks.filter(t=>t.project===p.id).length} tarefas concluídas</div><div class="task-meta">Prazo: ${dateBR(p.due)}</div><div style="margin-top:12px"><button class="danger" onclick="deleteProject('${p.id}')">Excluir projeto</button></div></div>`).join('')}</div>`:'<div class="empty">Nenhum projeto cadastrado. Crie um projeto para agrupar tarefas.</div>'}`}
$('projectForm').onsubmit=e=>{e.preventDefault();db.projects.push({id:'P'+Date.now(),name:$('pName').value.trim(),desc:$('pDesc').value,status:$('pStatus').value,due:$('pDue').value});$('projectModal').style.display='none';$('projectForm').reset();save()};
function deleteProject(id){if(confirm('Excluir o projeto? As tarefas não serão excluídas.')){db.projects=db.projects.filter(p=>p.id!==id);db.tasks.forEach(t=>{if(t.project===id)t.project=''});save()}}
function reportsPage(){let s=stats(),cats={};db.tasks.forEach(t=>cats[t.category||'Sem categoria']=(cats[t.category||'Sem categoria']||0)+1);return `<div class="grid">${card('Concluídas','Tarefas finalizadas',s.done)}${card('Em andamento','Em execução',s.progress)}${card('Alta prioridade','Em aberto',s.high)}${card('Atrasadas','Prazo vencido',s.late)}</div><div class="section card"><h2>Tarefas por categoria</h2>${Object.keys(cats).length?Object.entries(cats).map(([k,v])=>`<div style="margin-top:14px"><div class="section-head"><span>${esc(k)}</span><b>${v}</b></div><div class="progress"><span style="width:${Math.round(v/Math.max(s.total,1)*100)}%"></span></div></div>`).join(''):'<p class="muted">Ainda não há dados para exibir.</p>'}</div><div class="section card"><h2>Resumo de status</h2><div class="tablewrap" style="margin-top:12px"><table><tr><th>Status</th><th>Quantidade</th></tr>${['A fazer','Em andamento','Concluída','Arquivada'].map(st=>`<tr><td>${st}</td><td>${db.tasks.filter(t=>t.status===st).length}</td></tr>`).join('')}</table></div></div>`}
function configPage(){return `<div class="card"><h2>Dados e segurança</h2><p class="muted">Nesta versão, seus dados são armazenados localmente neste navegador e neste dispositivo. Eles não são enviados para a nuvem nem sincronizados automaticamente com outros aparelhos.</p><div class="actions"><button class="primary" onclick="exportData()">Baixar backup (JSON)</button><label class="secondary" style="display:inline-flex;align-items:center">Restaurar backup<input type="file" accept="application/json" style="display:none" onchange="importData(event)"></label></div></div><div class="section card"><h2>Preferências</h2><p class="muted">As opções de login, sincronização entre dispositivos, usuários e notificações push exigem conectar o sistema a um serviço de nuvem. Essa etapa será necessária para a versão online multiusuário.</p><p><b>Versão:</b> Protótipo funcional 1.0</p></div><div class="section"><button class="danger" onclick="if(confirm('Apagar todas as tarefas e projetos deste navegador?')){db={tasks:[],projects:[]};save()}">Apagar todos os dados</button></div>`}
function go(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
function render(){let titles={inicio:'Visão geral',tarefas:'Minhas tarefas',calendario:'Calendário',projetos:'Projetos',relatorios:'Relatórios',config:'Configurações'};$('pageTitle').textContent=titles[page];$('content').innerHTML=({inicio:dashboard,tarefas:taskPage,calendario:calendarPage,projetos:projectsPage,relatorios:reportsPage,config:configPage}[page])()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='minha-rotina-backup.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.tasks)||!Array.isArray(x.projects))throw Error();db=x;save();alert('Backup restaurado!')}catch{alert('Arquivo de backup inválido.')}};r.readAsText(f)}
render();
</script></body></html>
